[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aro-training"
version = "0.1.0"
description = "Daily training pipeline for ARO, ARO AI's own model"
requires-python = ">=3.10"
# Core deps: data export, cleaning and evaluation (no GPU needed).
dependencies = [
  "firebase-admin>=6.5,<8",
  "datasets>=2.20,<5",
  "huggingface_hub>=0.24,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# GPU training (installed in Colab / on the GPU machine).
train = ["unsloth", "trl>=0.12", "peft>=0.12", "transformers>=4.51", "accelerate", "bitsandbytes"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aro_training*", "aro_data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
