name: Edge Functions CI

on:
  push:
    paths: ["supabase/functions/**", ".github/workflows/functions-ci.yml"]
  pull_request:
    paths: ["supabase/functions/**", ".github/workflows/functions-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        run: deno check ai-router/index.ts aro-agent/index.ts file-process/index.ts export-artifact/index.ts
      - name: Unit tests
        run: deno test --allow-env tests/
