name: Edge Functions CI

on:
  push:
    paths: ["supabase/**", ".github/workflows/functions-ci.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/functions-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        run: deno check ai-router/index.ts aro-agent/index.ts aro-admin/index.ts aro-knowledge/index.ts file-process/index.ts export-artifact/index.ts
      # Includes the SQL migrations, run in an in-process Postgres (PGlite).
      - name: Unit tests
        run: deno test -A tests/
